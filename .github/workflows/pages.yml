name: Preparar site para GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-static:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Montar arquivos do site
        run: |
          rm -rf _site site.b64 site.tar.gz
          mkdir -p _site
          cat .site/part-* > site.b64
          base64 --decode site.b64 > site.tar.gz
          tar -xzf site.tar.gz -C _site
          test -f _site/index.html

      - name: Copiar para a raiz do repositório
        run: |
          cp -f _site/index.html ./index.html
          rm -rf ./casas ./assets
          cp -a _site/casas ./casas
          cp -a _site/assets ./assets
          touch .nojekyll

      - name: Salvar arquivos no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html casas assets .nojekyll
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
            exit 0
          fi
          git commit -m "Publica site estático no GitHub Pages"
          git push origin main
