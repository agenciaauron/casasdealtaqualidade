name: Publicar site no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar site atual
        run: |
          mkdir -p _site mirror
          wget             --mirror             --convert-links             --adjust-extension             --page-requisites             --no-parent             --domains casas-alta-qualidade.agenciaauron.chatgpt.site             --directory-prefix mirror             https://casas-alta-qualidade.agenciaauron.chatgpt.site/
          cp -a mirror/casas-alta-qualidade.agenciaauron.chatgpt.site/. _site/
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
